<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MHC Cài Đặt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { width: 340px; padding: 16px; background: #f0fdf4; color: #1e293b; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; border-bottom: 2px solid #16a34a; padding-bottom: 8px; }
    .header h1 { font-size: 15px; color: #166534; font-weight: 700; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    input[type="text"], select {
      width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff;
    }
    input[type="text"]:focus, select:focus { outline: none; border-color: #16a34a; }
    .btn {
      width: 100%; padding: 8px 12px; background: #16a34a; color: #fff; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #15803d; }
    .btn-secondary { background: #0284c7; margin-bottom: 8px; }
    .btn-secondary:hover { background: #0369a1; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .status-box {
      margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 11px;
      background: #e2e8f0; color: #475569; text-align: center;
    }
    .status-ok { background: #dcfce7; color: #166534; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🏥</span>
    <h1>MHC - BẮT BỆNH NHÂN TRẢ KQ</h1>
  </div>

  <div class="form-group">
    <label for="serverUrl">Địa chỉ máy chủ MHC:</label>
    <input type="text" id="serverUrl" placeholder="http://192.168.110.184:55637" />
  </div>

  <button id="btnConnect" class="btn btn-secondary">1. Tải danh sách phòng khám</button>

  <div class="form-group">
    <label for="areaSelect">2. Chọn phòng khám này:</label>
    <select id="areaSelect">
      <option value="">-- Chưa tải danh sách phòng --</option>
    </select>
  </div>

  <div class="switch-row">
    <label for="enableSync" style="margin:0; cursor:pointer;">Kích hoạt tự động bắt KQ:</label>
    <input type="checkbox" id="enableSync" checked style="width:18px; height:18px; cursor:pointer;" />
  </div>

  <button id="btnSave" class="btn">Lưu cấu hình</button>
  <button id="btnClearCalling" class="btn" style="background:#dc2626; margin-top:8px;">✖ Hủy gọi bệnh nhân ngoài TV</button>

  <div id="statusBox" class="status-box">Đang tải cấu hình...</div>

  <script src="popup.js"></script>
</body>
</html>
